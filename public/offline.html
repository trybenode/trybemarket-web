<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>You're offline | TrybeMarket</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;
      padding:24px;background:#f8fafc;color:#0f172a;text-align:center;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main{max-width:340px;width:100%}
    .logo{
      width:96px;height:96px;margin:0 auto 24px;border-radius:50%;
      box-shadow:0 8px 24px rgba(37,99,235,.18);
      animation:float 3.2s ease-in-out infinite;
    }
    h1{margin:0 0 8px;font-size:22px;font-weight:700}
    p{margin:0 0 28px;font-size:15px;line-height:1.55;color:#475569}
    button{
      appearance:none;border:0;cursor:pointer;width:100%;
      padding:14px 20px;border-radius:12px;
      background:#2563eb;color:#fff;font:inherit;font-weight:600;font-size:16px;
    }
    button:active{transform:scale(.98)}
    button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .status{margin-top:16px;font-size:13px;color:#64748b;min-height:18px}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @media (prefers-reduced-motion:reduce){.logo{animation:none}}
    @media (prefers-color-scheme:dark){
      body{background:#0b1220;color:#f1f5f9}
      p{color:#94a3b8}
      .status{color:#94a3b8}
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/icons/icon-192.png" width="96" height="96" alt="TrybeMarket">
    <h1>You're offline</h1>
    <p>TrybeMarket needs an internet connection to load listings and messages. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    var status = document.getElementById("status");
    function retry() {
      status.textContent = "Checking connection…";
      location.reload();
    }
    document.getElementById("retry").addEventListener("click", retry);
    // Come back to the real page on its own once the connection returns.
    window.addEventListener("online", retry);
  </script>
</body>
</html>
